<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PyPlay：给孩子的 Python 与海龟画图练习场，打开浏览器就能写代码。" />
    <title>PyPlay · 儿童 Python 海龟画图</title>
    <script>
      // Same rule as src/ui/theme.ts: a saved light/dark choice, otherwise the system.
      try {
        var savedTheme = localStorage.getItem("pyplay.theme");
        var theme =
          savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <img class="logo" src="/favicon.svg" alt="" />
          <span class="name">Py<span>Play</span></span>
        </div>
        <div class="project-box">
          <button id="project" class="btn ghost project-btn" title="我的项目">📁 …</button>
          <span id="save-state" class="save-state" aria-live="polite"></span>
        </div>
        <div class="actions">
          <button id="run" class="btn run" title="运行 (Ctrl+Enter)">▶ 运行</button>
          <button id="stop" class="btn stop" title="停止" disabled>■ 停止</button>
          <button id="library" class="btn ghost" title="打开示例库">📚 示例库</button>
          <select id="pace" class="select" aria-label="运行速度" title="逐行演示：每一步高亮正在执行的代码（快速引擎）">
            <option value="0">⏩ 正常速度</option>
            <option value="400">🐾 逐行演示</option>
            <option value="1000">🐌 逐行慢放</option>
          </select>
          <select id="engine" class="select" aria-label="运行引擎" title="运行引擎">
            <option value="auto">引擎：自动</option>
            <option value="fast">⚡ 快速引擎</option>
            <option value="python">🐍 完整 Python</option>
          </select>
        </div>
        <div class="actions secondary">
          <button id="theme" class="btn ghost icon" type="button" title="切换到深色" aria-label="切换到深色" aria-pressed="false">
            <span class="when-light" aria-hidden="true">🌙</span>
            <span class="when-dark" aria-hidden="true">☀️</span>
          </button>
          <button id="share" class="btn ghost icon" type="button" title="复制分享链接" aria-label="复制分享链接">🔗</button>
          <button id="save-image" class="btn ghost icon" type="button" title="保存画布为图片" aria-label="保存画布为图片">🖼️</button>
        </div>
      </header>
      <div id="lesson" class="lesson" hidden>
        <span id="lesson-label" class="lesson-label"></span>
        <span id="lesson-task" class="lesson-task"></span>
        <span id="lesson-state" class="lesson-state"></span>
        <button id="lesson-next" class="btn tiny" type="button" hidden>下一课</button>
      </div>
      <main class="workspace">
        <section class="pane editor-pane">
          <div id="editor" class="editor"></div>
        </section>
        <section class="pane side-pane">
          <div class="canvas-wrap">
            <canvas id="canvas" aria-label="海龟画布"></canvas>
            <div id="canvas-title" class="canvas-title"></div>
          </div>
          <div class="console-wrap">
            <div class="console-head">
              <span>输出</span>
              <span id="status" class="status">准备就绪</span>
              <button id="clear-console" class="btn tiny ghost">清空</button>
            </div>
            <div id="vars" class="vars" hidden></div>
            <div id="console" class="console" role="log" aria-live="polite"></div>
            <form id="input-row" class="input-row" hidden>
              <input id="input-field" autocomplete="off" placeholder="在这里输入，然后按回车" />
              <button class="btn tiny" type="submit">确定</button>
            </form>
          </div>
        </section>
      </main>
      <dialog id="dialog" class="dialog">
        <form method="dialog" id="dialog-form">
          <h3 id="dialog-title"></h3>
          <p id="dialog-prompt"></p>
          <input id="dialog-input" autocomplete="off" />
          <div class="dialog-actions">
            <button value="cancel" class="btn ghost" type="button" id="dialog-cancel">取消</button>
            <button value="ok" class="btn run" type="submit">确定</button>
          </div>
        </form>
      </dialog>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
